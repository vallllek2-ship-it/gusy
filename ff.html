<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Автобашня: Неоновый Город</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 20px 45px rgba(0,0,0,0.6);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #334155;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }
        h2 { margin-bottom: 5px; color: #f43f5e; text-transform: uppercase; }
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(56,189,248,0.3);
            transition: transform 0.1s;
        }
        button:hover {
            background-color: #7dd3fc;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">Машин в стеке: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas" width="400" height="550"></canvas>
    <div id="gameOverScreen">
        <h2>Башня упала!</h2>
        <p>Ваш результат: <span id="finalScore">0</span></p>
        <button onclick="resetGame(event)">Играть снова</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreVal = document.getElementById('scoreVal');
const finalScore = document.getElementById('finalScore');
const gameOverScreen = document.getElementById('gameOverScreen');

const CAR_WIDTH = 100;
const CAR_HEIGHT = 35;
const BASE_Y = canvas.height - CAR_HEIGHT - 20;

let blocks = [];
let score = 0;
let isGameOver = false;
let cameraY = 0;

// Параметры для генерации окон города
let windows = [];

let currentBlock = {
    x: 0,
    y: 60,
    angle: 0,
    speed: 0.04,
    range: 130,
    isDropping: false
};

function generateCityWindows() {
    windows = [];
    // Генерируем случайные светящиеся окна для зданий
    for (let i = 0; i < 50; i++) {
        windows.push({
            x: Math.random() * canvas.width,
            y: 150 + Math.random() * 300,
            lit: Math.random() > 0.4
        });
    }
}

function init() {
    blocks = [{ x: canvas.width / 2 - CAR_WIDTH / 2, y: BASE_Y }];
    score = 0;
    cameraY = 0;
    isGameOver = false;
    scoreVal.innerText = score;
    gameOverScreen.style.display = 'none';
    generateCityWindows();
    spawnBlock();
}

function spawnBlock() {
    currentBlock.isDropping = false;
    currentBlock.angle = Math.random() * 3;
    currentBlock.y = BASE_Y - (blocks.length * CAR_HEIGHT) - 100;
    currentBlock.speed = 0.04 + (score * 0.0035);
}

function dropBlock() {
    if (!currentBlock.isDropping && !isGameOver) {
        currentBlock.isDropping = true;
    }
}

window.addEventListener('keydown', (e) => { if (e.code === 'Space') dropBlock(); });
canvas.addEventListener('mousedown', dropBlock);

function update() {
    if (isGameOver) return;

    if (!currentBlock.isDropping) {
        currentBlock.angle += currentBlock.speed;
        currentBlock.x = (canvas.width / 2 - CAR_WIDTH / 2) + Math.sin(currentBlock.angle) * currentBlock.range;
    } else {
        currentBlock.y += 8;
        let targetBlock = blocks[blocks.length - 1];

        if (currentBlock.y >= targetBlock.y - CAR_HEIGHT) {
            let precision = Math.abs(currentBlock.x - targetBlock.x);

            if (precision < CAR_WIDTH - 15) {
                blocks.push({ x: currentBlock.x, y: targetBlock.y - CAR_HEIGHT });
                score++;
                scoreVal.innerText = score;
                cameraY = Math.max(0, (blocks.length * CAR_HEIGHT) - canvas.height / 2);
                spawnBlock();
            } else {
                isGameOver = true;
                finalScore.innerText = score;
                gameOverScreen.style.display = 'flex';
            }
        }
    }
}

function draw() {
    // 1. РИСУЕМ ВЕКТОРНЫЙ ФОН ГОРОДА
    // Небо (закатный неоновый градиент)
    let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#0f172a');
    skyGrad.addColorStop(0.5, '#1e1b4b');
    skyGrad.addColorStop(1, '#2e1065');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Дальние силуэты зданий (темно-фиолетовые)
    ctx.fillStyle = '#1e1b4b';
    ctx.fillRect(20, 200, 70, 350);
    ctx.fillRect(130, 150, 90, 400);
    ctx.fillRect(260, 250, 80, 300);

    // Ближние силуэты зданий (темнее)
    ctx.fillStyle = '#111329';
    ctx.fillRect(-10, 280, 80, 270);
    ctx.fillRect(80, 220, 80, 330);
    ctx.fillRect(200, 180, 90, 370);
    ctx.fillRect(320, 290, 90, 260);

    // Светящиеся окна в домах
    windows.forEach(w => {
        ctx.fillStyle = w.lit ? '#fef08a' : '#334155';
        ctx.fillRect(w.x, w.y, 6, 8);
    });

    // Луна / Солнце на фоне
    ctx.fillStyle = 'rgba(254, 240, 138, 0.15)';
    ctx.beginPath();
    ctx.arc(320, 90, 35, 0, Math.PI * 2);
    ctx.fill();

    // 2. ОТРИСОВКА ИГРОВЫХ ЭЛЕМЕНТОВ С КАМЕРОЙ
    ctx.save();
    ctx.translate(0, cameraY);

    // Дорога/Земля
    ctx.fillStyle = '#334155';
    ctx.fillRect(0, BASE_Y + CAR_HEIGHT, canvas.width, 30);
    ctx.fillStyle = '#475569';
    ctx.fillRect(0, BASE_Y + CAR_HEIGHT, canvas.width, 4);

    // Машины в башне
    blocks.forEach((block, index) => {
        ctx.fillStyle = `hsl(${(index * 65) % 360}, 70%, 50%)`;
        ctx.fillRect(block.x, block.y, CAR_WIDTH, CAR_HEIGHT - 10);
        ctx.fillRect(block.x + 20, block.y - 10, CAR_WIDTH - 40, 10);

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(block.x + 24, block.y + CAR_HEIGHT - 10, 7, 0, Math.PI * 2);
        ctx.arc(block.x + CAR_WIDTH - 24, block.y + CAR_HEIGHT - 10, 7, 0, Math.PI * 2);
        ctx.fill();
    });

    // Трос
    if (!currentBlock.isDropping) {
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, -cameraY);
        ctx.lineTo(currentBlock.x + CAR_WIDTH / 2, currentBlock.y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Летящая машина
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(currentBlock.x, currentBlock.y, CAR_WIDTH, CAR_HEIGHT - 10);
    ctx.fillRect(currentBlock.x + 20, currentBlock.y - 10, CAR_WIDTH - 40, 10);
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(currentBlock.x + 24, currentBlock.y + CAR_HEIGHT - 10, 7, 0, Math.PI * 2);
    ctx.arc(currentBlock.x + CAR_WIDTH - 24, currentBlock.y + CAR_HEIGHT - 10, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function resetGame(event) {
    if (event) event.stopPropagation();
    init();
}

init();
gameLoop();
</script>

</body>
</html>
